name: Gerar .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller==6.11.1
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Gerar CacaAoToken.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CacaAoToken
          --add-data "ui;ui" --add-data "data;data"
          --paths app app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CacaAoToken
          path: dist/CacaAoToken.exe
      - name: Ler versão
        id: ver
        shell: bash
        run: echo "v=$(grep -oP '^VERSION = \"\K[^\"]+' app/main.py)" >> "$GITHUB_OUTPUT"
      - name: Publicar versão
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Caça ao Token v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/CacaAoToken.exe
